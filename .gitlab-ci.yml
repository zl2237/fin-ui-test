# =============================================================================
# fin-ui-test GitLab CI/CD 配置（UI 自动化测试平台）
# 结构沿用 fin-api-test：lint → build → deploy → 企微通知，仅 main 触发
# -----------------------------------------------------------------------------
# 前置准备（GitLab 项目 → Settings → CI/CD → Variables，2026-10-26 已配置）：
#   SSH_PRIVATE_KEY   : 服务器 SSH 私钥（root@192.168.22.106 -p 13692）
#   WECOM_WEBHOOK     : 企微群机器人 webhook
#   JWT_SECRET_KEY    : 后端 JWT 密钥（生产）
#   DB_HOST/DB_PORT/DB_USER/DB_PASSWORD : MySQL 连接（同 fin-api-test 实例）
#   DB_NAME           : fin_ui_test（与 api 平台的 fin_api_test 同实例不同库）
#   Runner            : 复用 fin-api-test 的项目 runner（已指派给本项目）
# -----------------------------------------------------------------------------
# 服务器侧布局（与 fin-api-test 完全对称，端口错开不冲突）：
#   - 部署目录     : /opt/fin-ui-test
#   - 后端 venv    : /opt/fin-ui-test/platform/backend/venv（python3.12）
#   - 后端服务     : systemd 服务名 fin-ui-test（uvicorn :8002）
#   - 前端静态目录 : /opt/fin-ui-test/platform/frontend/dist（nginx :8090）
#   - Playwright   : chromium 二进制在 /root/.cache/ms-playwright（部署不动它，
#                    缺失时 deploy 内自动补装，PLAYWRIGHT_DOWNLOAD_HOST 走国内镜像）
# =============================================================================

stages:
  - lint
  - build
  - deploy
  - notify

variables:
  SSH_HOST: "192.168.22.106"
  SSH_PORT: "13692"
  SSH_USER: "root"
  DEPLOY_DIR: "/opt/fin-ui-test"
  FRONTEND_DIST: "/opt/fin-ui-test/platform/frontend/dist"
  SYSTEMD_SERVICE: "fin-ui-test"
  PIP_INDEX: "https://pypi.tuna.tsinghua.edu.cn/simple"
  NPM_REGISTRY: "https://registry.npmmirror.com"
  GIT_DEPTH: "1"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.ssh_template: &ssh_setup
  before_script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p $SSH_PORT $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

# ===========================================================================
# 1. Lint / 检查
# ===========================================================================
backend-lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff -i $PIP_INDEX
    # 仅 pyflakes 类错误阻塞（未定义变量/未用 import），风格不挡门
    - ruff check --select F platform/backend
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# 全量单测（fake-db，不连真实 MySQL）；DB_PASSWORD/JWT 为空会 import 即炸，给哑值
backend-check:
  stage: lint
  image: python:3.12-slim
  script:
    - cd platform/backend
    - pip install -r requirements.txt pytest -i $PIP_INDEX
    - export DB_PASSWORD=ci-dummy JWT_SECRET_KEY=ci-dummy
    - python -m pytest tests -q
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

frontend-lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd platform/frontend
    - npm config set registry $NPM_REGISTRY
    - npm ci
    # vue-tsc 类型检查 + vitest 单测，均 blocking
    - npx vue-tsc --noEmit
    - npm run test
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ===========================================================================
# 2. Build 前端构建（后端 Python 免构建）
# ===========================================================================
frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd platform/frontend
    - npm config set registry $NPM_REGISTRY
    - npm ci
    - npm run build
  artifacts:
    name: "frontend-dist-${CI_COMMIT_SHORT_SHA}"
    paths:
      - platform/frontend/dist
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ===========================================================================
# 3. Deploy（沿用 fin-api-test 原子部署结构：trap 兜底重启，pip/alembic 失败降级警告）
# ===========================================================================
deploy:
  stage: deploy
  image: alpine:latest
  <<: *ssh_setup
  script:
    - echo "JWT_SECRET_KEY=$JWT_SECRET_KEY" > /tmp/.env.deploy
    - echo "DB_HOST=$DB_HOST" >> /tmp/.env.deploy
    - echo "DB_PORT=$DB_PORT" >> /tmp/.env.deploy
    - echo "DB_USER=$DB_USER" >> /tmp/.env.deploy
    - echo "DB_PASSWORD=$DB_PASSWORD" >> /tmp/.env.deploy
    - echo "DB_NAME=$DB_NAME" >> /tmp/.env.deploy
    - echo "CORS_ORIGINS=http://$SSH_HOST:8090" >> /tmp/.env.deploy
    - cd platform/frontend
    - tar czf /tmp/frontend-dist.tar.gz -C dist .
    - cd -
    - scp -P $SSH_PORT /tmp/.env.deploy $SSH_USER@$SSH_HOST:$DEPLOY_DIR/platform/backend/.env
    - scp -P $SSH_PORT /tmp/frontend-dist.tar.gz $SSH_USER@$SSH_HOST:/tmp/frontend-dist.tar.gz
    - rm -f /tmp/.env.deploy /tmp/frontend-dist.tar.gz
    - |
      ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "SYSTEMD_SERVICE='$SYSTEMD_SERVICE' bash -s" <<'REMOTE'
        set -u
        DEPLOY_DIR=/opt/fin-ui-test
        BACKEND_DIR=$DEPLOY_DIR/platform/backend
        warn=""

        finish() {
          # 重启必达：代码已 reset，不重启的半部署比带着警告重启危险得多
          echo "[deploy] 重启服务 $SYSTEMD_SERVICE ..."
          systemctl restart "$SYSTEMD_SERVICE"
          sleep 5
          if systemctl is-active --quiet "$SYSTEMD_SERVICE"; then
            echo "[deploy] 服务已运行"
          else
            echo "[deploy][严重] 重启后服务未运行！请执行 journalctl -u $SYSTEMD_SERVICE -n 50 排查"
            exit 1
          fi
        }
        trap finish EXIT

        set -e
        cd "$DEPLOY_DIR"
        git fetch origin main
        git reset --hard origin/main

        rm -rf "$DEPLOY_DIR/platform/frontend/dist"
        mkdir -p "$DEPLOY_DIR/platform/frontend/dist"
        tar xzf /tmp/frontend-dist.tar.gz -C "$DEPLOY_DIR/platform/frontend/dist"
        rm -f /tmp/frontend-dist.tar.gz

        if ! (
          cd "$BACKEND_DIR"
          [ -d venv ] || python3.12 -m venv venv
          source venv/bin/activate
          pip install -U pip -q -i https://pypi.tuna.tsinghua.edu.cn/simple
          pip install -r requirements.txt -q -i https://pypi.tuna.tsinghua.edu.cn/simple
        ); then
          warn="$warn 依赖安装失败(已用现有依赖重启);"
        fi

        # Playwright 浏览器二进制：装机时装过一次就持久（~/.cache/ms-playwright），
        # 部署只查缺补装，不重复下载 120MB
        if ! ls /root/.cache/ms-playwright/chromium* >/dev/null 2>&1; then
          echo "[deploy][playwright] 浏览器缺失，补装 chromium ..."
          ( cd "$BACKEND_DIR" && source venv/bin/activate \
            && PLAYWRIGHT_DOWNLOAD_HOST=https://npmmirror.com/mirrors/playwright/ \
               python -m playwright install chromium ) \
            || warn="$warn playwright浏览器补装失败;"
        fi

        if ! (
          cd "$BACKEND_DIR" && source venv/bin/activate && alembic upgrade head
        ); then
          warn="$warn 数据库迁移失败;"
        fi

        if [ -n "$warn" ]; then
          echo "[deploy][警告]$warn"
          exit 1
        fi
        echo "[deploy] 部署完成"
      REMOTE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: http://192.168.22.106:8090

# ===========================================================================
# 4. 企微通知（成功/失败双任务；when 必须写在 rules 内——job 级 when 会被忽略）
# ===========================================================================
notify-success:
  stage: notify
  image: alpine:latest
  script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
    - apk add --no-cache curl tzdata jq
    - |
      NL=$(printf '\n')
      COMMIT_MSG=$(printf '%s' "${CI_COMMIT_MESSAGE}" | head -n 1)
      MARKDOWN="## fin-ui-test 部署通知  ✅ 成功${NL}"
      MARKDOWN="${MARKDOWN}> **项目**：[${CI_PROJECT_NAME}](${CI_PROJECT_URL})${NL}"
      MARKDOWN="${MARKDOWN}> **分支**：${CI_COMMIT_BRANCH}${NL}"
      MARKDOWN="${MARKDOWN}> **提交**：${CI_COMMIT_SHORT_SHA} - ${COMMIT_MSG}${NL}"
      MARKDOWN="${MARKDOWN}> **提交者**：${GITLAB_USER_NAME}${NL}"
      MARKDOWN="${MARKDOWN}> **时间**：$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')${NL}"
      MARKDOWN="${MARKDOWN}> **流水线**：[查看详情](${CI_PIPELINE_URL})${NL}"
      MARKDOWN="${MARKDOWN}> **线上**：http://192.168.22.106:8090${NL}"
      PAYLOAD=$(jq -n --arg md "$MARKDOWN" '{msgtype:"markdown",markdown:{content:$md}}')
      curl -s -X POST "$WECOM_WEBHOOK" -H 'Content-Type: application/json' -d "$PAYLOAD"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

notify-failure:
  stage: notify
  image: alpine:latest
  script:
    - sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
    - apk add --no-cache curl tzdata jq
    # 摘要段整体 ( ) || true 兜底：摘要失败不阻断企微发送；注释只留 YAML 层
    - |
      NL=$(printf '\n')
      FAIL_SECTION=""
      API_BASE="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      if [ -n "$GITLAB_API_TOKEN" ]; then
        AUTH_H="PRIVATE-TOKEN: $GITLAB_API_TOKEN"
      else
        AUTH_H="Job-Token: $CI_JOB_TOKEN"
      fi
      (
        JOBS_JSON=$(curl -s -H "$AUTH_H" "$API_BASE/pipelines/$CI_PIPELINE_ID/jobs" || true)
        FAILED_JOBS=$(echo "$JOBS_JSON" | jq -r '.[]? | select(.status=="failed") | "\(.id)|\(.name)"' 2>/dev/null || true)
        if [ -n "$FAILED_JOBS" ]; then
          FAIL_SECTION="${NL}> **失败原因摘要**：${NL}"
          for line in $FAILED_JOBS; do
            JID="${line%%|*}"; JNAME="${line##*|}"
            REASON=$(curl -s -H "$AUTH_H" "$API_BASE/jobs/$JID/trace" 2>/dev/null | tail -n 300 | grep -iE "error|failed|exception|traceback" | tail -n 6 | sed 's/[[:space:]]\+/ /g; s/^ //; s/ $//' | head -c 800)
            if [ -n "$REASON" ]; then
              FAIL_SECTION="${FAIL_SECTION}> 【${JNAME}】${NL}> \`\`\`${NL}${REASON}${NL}\`\`\`${NL}"
            else
              FAIL_SECTION="${FAIL_SECTION}> 【${JNAME}】未能提取摘要（token 无权限读日志，建议配置 GITLAB_API_TOKEN）${NL}"
            fi
          done
        fi
      ) || true
    - |
      COMMIT_MSG=$(printf '%s' "${CI_COMMIT_MESSAGE}" | head -n 1)
      NL=$(printf '\n')
      MARKDOWN="## fin-ui-test 部署通知  ❌ 失败${NL}"
      MARKDOWN="${MARKDOWN}> **项目**：[${CI_PROJECT_NAME}](${CI_PROJECT_URL})${NL}"
      MARKDOWN="${MARKDOWN}> **分支**：${CI_COMMIT_BRANCH}${NL}"
      MARKDOWN="${MARKDOWN}> **提交**：${CI_COMMIT_SHORT_SHA} - ${COMMIT_MSG}${NL}"
      MARKDOWN="${MARKDOWN}> **提交者**：${GITLAB_USER_NAME}${NL}"
      MARKDOWN="${MARKDOWN}> **时间**：$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')${NL}"
      MARKDOWN="${MARKDOWN}> **流水线**：[查看详情](${CI_PIPELINE_URL})${NL}"
      MARKDOWN="${MARKDOWN}${FAIL_SECTION}"
      PAYLOAD=$(jq -n --arg md "$MARKDOWN" '{msgtype:"markdown",markdown:{content:$md}}')
      RESP=$(curl -s -X POST "$WECOM_WEBHOOK" -H 'Content-Type: application/json' -d "$PAYLOAD")
      echo "wecom response: $RESP"
      ERRCODE=$(echo "$RESP" | jq -r '.errcode // 1' 2>/dev/null || echo 1)
      if [ "$ERRCODE" != "0" ]; then
        echo "[notify][严重] 企微 webhook 发送失败（errcode=$ERRCODE），请检查 WECOM_WEBHOOK 变量"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_failure
